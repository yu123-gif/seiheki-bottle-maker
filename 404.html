<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>性癖の瓶メーカー</title>
  <meta name="theme-color" content="#0d1636">
  <meta name="description" content="赤い瓶・青い瓶で傾向を鑑定するオラクル風Webアプリ">
  <style>
    :root{
      --bg:#fbf1f6;
      --panel:#ffffff;
      --text:#241824;
      --muted:#746874;
      --line:#efcadc;
      --accent:#d94d98;
      --accent-soft:#fff0f7;
      --blue:#6da6ff;
      --yellow:#f1c84d;
      --red:#f26b78;
      --dark:#0d1636;
      --dark2:#121f49;
      --dark3:#18275a;
      --ink:#eef2ff;
      --shadow:0 12px 30px rgba(214,93,159,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#fbe7f2 0,#fbf1f6 220px);
      color:var(--text);
      line-height:1.6;
    }
    main{width:min(1200px,calc(100% - 18px));margin:0 auto;padding:18px 0 42px}
    h1{margin:0;font-size:clamp(2rem,5vw,3rem);line-height:1.1}
    .sub{color:var(--muted);margin:.4rem 0 0}
    .panel,.metric,.result-wrap,.poster-wrap{
      background:rgba(255,255,255,.92);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
    }
    .panel{padding:16px;margin:14px 0}
    .top-note{background:linear-gradient(90deg,#fff,var(--accent-soft));border-left:6px solid var(--accent)}

    .profile-select{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin:14px 0 8px;
    }
    .profile-btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:13px 12px;
      text-align:left;
      min-height:78px;
      transition:.12s transform,.12s border-color,.12s box-shadow,.12s background;
      cursor:pointer;
    }
    .profile-btn:hover{
      transform:translateY(-1px);
      border-color:var(--accent);
      box-shadow:0 8px 20px rgba(214,93,159,.12);
    }
    .profile-btn.active{
      background:var(--accent-soft);
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(217,77,152,.12);
    }
    .profile-title{
      display:block;
      font-weight:1000;
      font-size:1.04rem;
      margin-bottom:4px;
    }
    .profile-desc{
      display:block;
      color:var(--muted);
      font-size:.86rem;
      line-height:1.35;
    }
    .profile-heading{
      margin:14px 0 6px;
      font-size:.95rem;
      color:var(--muted);
      font-weight:900;
    }
    .profile-chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin:6px 0 12px;
    }
    .profile-chip{
      display:inline-flex;
      align-items:center;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.10);
      color:#fff;
      border-radius:999px;
      padding:5px 10px;
      font-size:.84rem;
      font-weight:900;
    }
    #lineAppBtn,#lineResultBtn{
      border-color:#06c755;
      font-weight:800;
      color:#075d2b;
      background:#effff5;
    }
    .copy-status{
      font-size:.9rem;
      color:#075d2b;
      font-weight:800;
      align-self:center;
    }
    @media(max-width:640px){
      .profile-select{grid-template-columns:1fr}
    }

    .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .legend div{padding:10px 12px;border-radius:14px;border:1px solid var(--line);font-weight:800}
    .legend .blue{background:#dce9ff}
    .legend .yellow{background:#fff2c7}
    .legend .red{background:#ffe2e6}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
    button,select{
      font:inherit;border:1px solid var(--line);background:#fff;color:var(--text);
      border-radius:14px;padding:10px 14px
    }
    button{cursor:pointer}
    button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
    .metric{padding:14px}
    .metric .label{font-size:.84rem;color:var(--muted)}
    .metric .value{font-size:1.7rem;font-weight:900;line-height:1.15}
    .metric .hint{font-size:.84rem;color:var(--muted)}
    .group{margin:24px 0}
    .group-title{display:flex;align-items:center;gap:8px;font-weight:900;margin-bottom:10px}
    .group-title .heart{color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
    .bottle-card{
      min-height:152px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;
      transition:.12s transform,.12s border-color,.12s box-shadow,.12s background;
    }
    .bottle-card:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 8px 20px rgba(214,93,159,.12)}
    .tone-empty{background:#fff}
    .tone-blue{background:#dce9ff}
    .tone-yellow{background:#fff2c7}
    .tone-red{background:#ffe2e6}
    .bottle-btn{
      width:100%;min-height:132px;background:transparent;border:0;padding:0;
      display:grid;place-items:center;gap:6px;color:var(--text);
      user-select:none;-webkit-user-select:none;touch-action:none
    }
    .bottle-visual{
      position:relative;
      width:76px;
      height:90px;
      display:grid;
      place-items:center;
    }
    .bottle-inner-label{display:none}
    
    .bottle-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
    .holding{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
    .bottle-svg{width:76px;height:90px;display:block}
    .bottle-name{font-size:.94rem;font-weight:1000;line-height:1.08;text-align:center;overflow-wrap:anywhere;display:block;max-width:100%}
    .bottle-score{font-size:.74rem;color:var(--muted);text-align:center}
    .result-wrap{padding:18px;margin-top:24px}
    .result-title{font-size:1.5rem;font-weight:900;margin:0 0 12px}
    .oracle-card{
      background:linear-gradient(180deg,#0a1431,#12204b);
      color:var(--ink);
      border-radius:22px;
      border:1px solid #35457f;
      padding:18px;
      box-shadow:0 18px 40px rgba(10,20,49,.28);
      position:relative;
      overflow:hidden;
    }
    .oracle-card::before,.oracle-card::after{
      content:"";
      position:absolute;border-radius:999px;filter:blur(20px);opacity:.18
    }
    .oracle-card::before{width:180px;height:180px;background:#b14cff;top:-50px;left:-40px}
    .oracle-card::after{width:220px;height:220px;background:#1c9fff;bottom:-80px;right:-50px}
    .oracle-inner{position:relative;z-index:1}
    .oracle-kicker{font-size:1rem;font-weight:900;letter-spacing:.04em;color:#f5d8ff;text-align:center}
    .oracle-main-title{
      font-size:clamp(1.6rem,4vw,2.5rem);font-weight:1000;text-align:center;line-height:1.15;
      color:#f7cbff;margin:8px 0 12px
    }
    .oracle-summary{font-size:1rem;color:#eef1ff;margin:0 0 16px}
    .section-label{
      font-size:.96rem;font-weight:900;color:#cfe0ff;display:flex;align-items:center;gap:8px;margin:12px 0 10px
    }
    .insight-grid{display:grid;grid-template-columns:1fr;gap:10px}
    .insight-box{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(189,203,255,.18);
      border-radius:16px;
      padding:14px
    }
    .insight-box h4{margin:0 0 6px;font-size:1.04rem;color:#ffffff}
    .insight-box p{margin:0;color:#e6ebff}
    .mini-stats{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
    .mini-row{display:grid;gap:4px}
    .mini-row .top{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;color:#f2f4ff}
    .mini-track{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
    .mini-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7ca8ff,#d85eff)}
    .bottom-picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .pick{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(189,203,255,.18);
      border-radius:16px;
      padding:14px;
      min-height:86px
    }
    .pick .cap{font-size:.85rem;color:#c7d6ff;font-weight:800}
    .pick .txt{font-size:1.04rem;font-weight:900;color:#fff;line-height:1.3;margin-top:4px}
    .bars{margin-top:18px;display:grid;gap:10px}
    .bar-head{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-bottom:4px}
    .bar-track{height:11px;border-radius:999px;background:#eedee7;overflow:hidden}
    .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#f5be41,#f04b72)}
    textarea{
      width:100%;min-height:118px;border:1px solid var(--line);background:#fff;border-radius:14px;
      padding:12px;font:inherit;resize:vertical
    }

    /* Screenshot board */
    .screen-panel{margin-top:22px}
    .screen-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
    .poster-wrap{padding:12px;overflow:auto}
    .poster{
      width:1150px;background:#fff;border-radius:12px;padding:8px 10px 10px;color:#151515
    }
    .poster-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .poster-title{font-size:32px;font-weight:1000;line-height:1.1}
    .poster-sub{font-size:14px;color:#666;margin-top:3px}
    .poster-legend{display:grid;gap:4px;font-size:18px;font-weight:900}
    .poster-legend .r{color:#ef4444}.poster-legend .y{color:#ca8a04}.poster-legend .b{color:#2563eb}
    .poster-summary{
      margin:8px 0 14px;padding:8px 10px;border:2px solid #f2bad4;background:#fff0f7;border-radius:12px;
      display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800
    }
    .poster-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;align-items:start}
    .poster-col{display:grid;gap:6px}
    .poster-cat{
      min-height:40px;border:2px solid #f3b7d3;border-radius:999px;background:#fff7fb;padding:4px;
      display:grid;place-items:center;text-align:center;font-size:13px;font-weight:900;line-height:1.1
    }
    .poster-bottle{
      height:64px;position:relative;padding:0 3px 4px
    }
    .poster-bottle .neck{
      position:absolute;left:50%;top:0;transform:translateX(-50%);width:22px;height:10px;background:#fff;
      border:2px solid #222;border-bottom:0;border-radius:6px 6px 0 0;z-index:3
    }
    .poster-bottle .cap{
      position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:26px;height:6px;background:#444;
      border-radius:4px;z-index:4
    }
    .poster-bottle .body{
      position:absolute;left:2px;right:2px;top:8px;bottom:0;background:#fff;border:2px solid #222;border-radius:12px 12px 16px 16px;overflow:hidden
    }
    .poster-bottle .glass{
      position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,255,255,0) 20%,rgba(255,255,255,.17) 78%,rgba(255,255,255,0))
    }
    .poster-bottle .fill{
      position:absolute;left:0;right:0;bottom:0;height:0;background:#fff;opacity:.88
    }
    .poster-bottle .label{
      position:absolute;left:3px;right:3px;top:14px;bottom:4px;display:-webkit-box;
      -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
      text-align:center;font-size:15.4px;line-height:.90;font-weight:1000;z-index:5;
      align-items:center;justify-content:center;
      word-break:keep-all;overflow-wrap:anywhere;
      text-shadow:0 1px 0 rgba(255,255,255,.97),1px 0 0 rgba(255,255,255,.90),-1px 0 0 rgba(255,255,255,.90);
      letter-spacing:-.04em
    }
    .poster-foot{margin-top:12px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#666}

    @media(orientation:landscape) and (max-height:520px){
      .poster{width:100vw;padding:4px;border-radius:0}
      .poster-grid{grid-template-columns:repeat(11,1fr);gap:5px}
      .poster-col{gap:4px}
      .poster-cat{min-height:27px;font-size:9.6px;padding:2px}
      .poster-bottle{height:42px;padding:0 1px 2px}
      .poster-bottle .cap{width:18px;height:5px;top:-3px}
      .poster-bottle .neck{width:16px;height:7px}
      .poster-bottle .body{top:6px;border-radius:8px 8px 10px 10px}
      .poster-bottle .label{top:10px;bottom:2px;font-size:10.4px;line-height:.86;left:2px;right:2px}
      .poster-foot{display:none}
    }


    .poster-shot-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      padding:4px 4px 8px;
      margin-bottom:8px;
      border-bottom:2px solid rgba(17,24,39,.12);
    }
    .poster-shot-title{
      font-size:34px;
      line-height:1.05;
      font-weight:1000;
      letter-spacing:-.04em;
      color:#111827;
    }
    .poster-shot-sub{
      margin-top:3px;
      font-size:13px;
      line-height:1.2;
      color:#4b5563;
      font-weight:900;
    }
    .poster-shot-meta{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:6px;
      max-width:48%;
    }
    .poster-shot-meta span{
      border:2px solid #f0a6c8;
      background:#fff7fb;
      border-radius:999px;
      padding:4px 9px;
      font-size:12px;
      line-height:1;
      font-weight:1000;
      color:#111827;
      white-space:nowrap;
    }
    @media(orientation:landscape) and (max-height:520px){
      .poster-shot-head{
        padding:2px 2px 4px;
        margin-bottom:4px;
      }
      .poster-shot-title{
        font-size:18px;
      }
      .poster-shot-sub{
        font-size:8.5px;
        margin-top:1px;
      }
      .poster-shot-meta{
        gap:3px;
        max-width:56%;
      }
      .poster-shot-meta span{
        font-size:7.5px;
        padding:2px 4px;
        border-width:1px;
      }
    }


    .poster-shot-result{
      margin:0 0 8px;
      display:grid;
      grid-template-columns:1.35fr .9fr;
      gap:8px;
    }
    .poster-shot-result .result-box{
      border:2px solid #f0a6c8;
      background:#fff7fb;
      border-radius:14px;
      padding:7px 10px;
      color:#111827;
      overflow:hidden;
    }
    .poster-shot-result .cap{
      font-size:10.5px;
      color:#6b7280;
      font-weight:1000;
      margin-bottom:2px;
      letter-spacing:.02em;
    }
    .poster-shot-result .main{
      font-size:18px;
      line-height:1.15;
      font-weight:1000;
      letter-spacing:-.02em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .poster-shot-result .main.depth{
      color:#be185d;
    }
    @media(orientation:landscape) and (max-height:520px){
      .poster-shot-result{
        margin-bottom:4px;
        gap:4px;
      }
      .poster-shot-result .result-box{
        padding:3px 5px;
        border-radius:8px;
        border-width:1px;
      }
      .poster-shot-result .cap{
        font-size:7px;
        margin-bottom:1px;
      }
      .poster-shot-result .main{
        font-size:10px;
        line-height:1.05;
      }
    }

    .hidden{display:none!important}
    .poster-only .main-app{display:none}
    .poster-only .poster-wrap{padding:0;border:none;box-shadow:none;overflow:visible}
    .poster-only .poster{width:1150px;border-radius:0}
    .poster-only main{width:100%;padding:0}
    .poster-only .screen-tools{padding:10px;background:#fff;position:sticky;top:0;z-index:9}
    @media(max-width:980px){
      .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .metrics{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:640px){
      main{width:min(100% - 12px,1200px)}
      .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
      .bottle-card{min-height:132px;padding:6px}
      .bottle-btn{min-height:118px}
      .bottle-svg{width:68px;height:82px}
      .bottle-name{font-size:.94rem;font-weight:1000;line-height:1.08;text-align:center;overflow-wrap:anywhere;display:block;max-width:100%}
      .bottle-score{font-size:.66rem}
      .legend,.bottom-picks{grid-template-columns:1fr}
      .metrics{grid-template-columns:1fr 1fr}
      .poster{width:1120px}
    }
  </style>
</head>
<body>
  <main>
    <div class="main-app">
      <header>
        <h1>性癖の瓶メーカー</h1>
        <p class="sub">〜あなたの中の赤い瓶、青い瓶を分析します〜</p>
      </header>

      <section class="panel top-note">
        <div class="profile-heading">1. S/M気質を選択</div>
        <div id="smSelect" class="profile-select" aria-label="S/M気質を選択">
          <button type="button" class="profile-btn sm-btn" data-sm="S">
            <span class="profile-title">S気質</span>
            <span class="profile-desc">相手をリードしたい。反応を引き出す側。</span>
          </button>
          <button type="button" class="profile-btn sm-btn" data-sm="M">
            <span class="profile-title">M気質</span>
            <span class="profile-desc">相手に委ねたい。扱われることで燃える側。</span>
          </button>
          <button type="button" class="profile-btn sm-btn" data-sm="Mix">
            <span class="profile-title">どちらも</span>
            <span class="profile-desc">相手や空気で、攻めと受けが入れ替わる。</span>
          </button>
        </div>

        <div class="profile-heading">2. 性別を選択</div>
        <div id="genderSelect" class="profile-select" aria-label="性別を選択">
          <button type="button" class="profile-btn gender-btn" data-gender="male">
            <span class="profile-title">男性</span>
            <span class="profile-desc">独占欲・主導権・守りたい欲を少し強めに読む。</span>
          </button>
          <button type="button" class="profile-btn gender-btn" data-gender="female">
            <span class="profile-title">女性</span>
            <span class="profile-desc">安心感・委ね方・愛され方を少し強めに読む。</span>
          </button>
          <button type="button" class="profile-btn gender-btn" data-gender="other">
            <span class="profile-title">その他・未回答</span>
            <span class="profile-desc">性別に寄せすぎず、瓶の傾向を中心に読む。</span>
          </button>
        </div>

        <div class="legend">
          <div class="blue">青：できない</div>
          <div class="yellow">黄：妄想ならあり</div>
          <div class="red">赤：興奮する</div>
        </div>
        <div class="controls">
          <select id="filter"><option value="all">全項目</option></select>
          <button id="resetBtn" type="button">リセット</button>
          <button id="shareBtn" type="button">共有文を作成</button>
          <button id="posterBtn" class="primary" type="button">瓶一覧結果を表示</button>
          <button id="lineAppBtn" type="button">アプリURLをコピー</button>
          <button id="lineResultBtn" type="button">診断結果をコピー</button><span id="copyStatus" class="copy-status"></span>
        </div>
      </section>

      <section class="metrics" aria-live="polite">
        <div class="metric"><div class="label">総合タイプ</div><div id="typeName" class="value">未診断</div><div id="typeHint" class="hint">瓶を選んでください</div></div>
        <div class="metric"><div class="label">赤い瓶</div><div id="redCount" class="value">0</div><div class="hint">興奮する</div></div>
        <div class="metric"><div class="label">青い瓶</div><div id="blueCount" class="value">0</div><div class="hint">できない</div></div>
        <div class="metric"><div class="label">総瓶数</div><div id="totalCount" class="value">105</div><div id="doneCount" class="hint">入力済み 0</div></div>
      </section>

      <section id="groupArea"></section>

      <section class="result-wrap">
        <h2 class="result-title">分析結果</h2>
        <div id="resultText">まだ瓶が選ばれていません。</div>
        <div id="categoryBars" class="bars"></div>
        <h3 style="margin:20px 0 8px;font-size:1.18rem">共有用コピー結果</h3>
        <textarea id="shareText" readonly>共有文を作成するとここに表示されます。</textarea>
      </section>
    </div>

    <section id="screenPanel" class="screen-panel hidden">
      <div class="screen-tools">
        <button id="backBtn" type="button">通常画面に戻る</button>
        <button id="printBtn" type="button">印刷 / PDF保存</button>
      </div>
      <div class="poster-wrap">
        <div id="poster" class="poster"></div>
      </div>
    </section>
  </main>

  <script>
    // 古いキャッシュの影響を切る
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister())).catch(()=>{});
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))).catch(()=>{});
    }

    const groups = [
      {cat:'最下層マン',items:['奴隷','謝罪','足で踏まれる','身の回りの世話','服装の差','土下座','アナル、金玉舐め','重りをもって同じ姿勢','人間家具','荷物持ち','最下層奉仕']},
      {cat:'被虐マン',items:['アナル開発','タトゥー・ピアス','匂いザーメン中毒','貢ぎ','晒し','風俗堕ち','孕ませ','借金']},
      {cat:'オナホマン',items:['即ハメ','悪癖','口枷','貸し出し','呼び出し','生ハメ','ザーメンタンク','飲尿','浴尿','くい打ちピストン','男尊女卑']},
      {cat:'表露マン',items:['身体検査','罰ゲーム','淫語強制','全頭マスク','下品なポーズ','鼻フック','アヘオホ','立小便','性的いじめ','変態芸','宴会芸']},
      {cat:'管理マン',items:['絶頂管理','行動報告','下着管理','会話チェック','睡眠管理','服装管理','食事管理','排泄管理','髪型管理','金銭管理']},
      {cat:'ガチボコマン',items:['腹パン','噛み跡','はたく','蹴り','あざ']},
      {cat:'主従マン',items:['足かせ','お仕置き','犬扱い','帰宅後即奉仕','首輪（椅子に固定）','全身リップ','全裸飼育','檻','外の世界と隔離']},
      {cat:'首輪マン',items:['あまあま','言葉責め','首輪（リード）','ご奉仕','おもちゃ責め','焦らし','寸止め','首絞め','しつけ','拘束','束縛']},
      {cat:'フェチマン',items:['複数','コスプレ','落書き','パイパン','催眠','緊縛','体液','女体盛','母乳','イメプ','スカトロ']},
      {cat:'露出マン',items:['ネカフェでのプレイ','車中プレイ','遠隔ローター','ノーパンノーブラ','羞恥お使い','公衆での羞恥会話','露出度の高い衣装']},
      {cat:'背徳愛マン',items:['寝取られ','浮気SEX','叱られながら責められる','彼氏よりでかちんに責められる','彼氏の悪口','電話しながらH','自宅でH','SEX懇願','はめ撮り','彼氏とSEX禁止','不倫']}
    ];
    const state = {};
    let filter = 'all';
    let smTrait = '';
    let genderTrait = '';
    let activeKey = '';
    let startAt = 0;
    let wasLong = false;
    let timer = 0;
    let svgClipSeq = 0;

    const groupArea = document.getElementById('groupArea');
    const filterSelect = document.getElementById('filter');
    groups.forEach(group => {
      group.items.forEach(item => state[keyOf(group.cat,item)] = 0);
      const opt = document.createElement('option');
      opt.value = group.cat;
      opt.textContent = group.cat;
      filterSelect.appendChild(opt);
    });

    function keyOf(cat,item){ return cat + '|' + item; }
    function escapeHtml(v){
      return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function formatBottleLabel(item){
      const specials = {
        'ノーパンノーブラ':'ノーパン<br>ノーブラ',
        'ネカフェでのプレイ':'ネカフェでの<br>プレイ',
        '彼氏よりでかちんに責められる':'彼氏よりでかちんに<br>責められる',
        '重りをもって同じ姿勢':'重りをもって<br>同じ姿勢',
        '首輪（椅子に固定）':'首輪<br>（椅子に固定）',
        '公衆での羞恥会話':'公衆での<br>羞恥会話',
        '叱られながら責められる':'叱られながら<br>責められる',
        '遠隔ローター':'遠隔<br>ローター',
        'アナル、金玉舐め':'アナル、<br>金玉舐め',
        '匂いザーメン中毒':'匂いザーメン<br>中毒',
        'タトゥー・ピアス':'タトゥー・<br>ピアス',
        '身体検査':'身体<br>検査',
        '行動報告':'行動<br>報告',
        '絶頂管理':'絶頂<br>管理',
        '睡眠管理':'睡眠<br>管理',
        '食事管理':'食事<br>管理',
        '金銭管理':'金銭<br>管理',
        '会話チェック':'会話<br>チェック',
        '下着管理':'下着<br>管理',
        '服装管理':'服装<br>管理',
        '排泄管理':'排泄<br>管理',
        '髪型管理':'髪型<br>管理',
        '全身リップ':'全身<br>リップ',
        '外の世界と隔離':'外の世界と<br>隔離',
        '電話しながらH':'電話しながら<br>H',
        '露出度の高い衣装':'露出度の高い<br>衣装',
        '風俗堕ち':'風俗<br>堕ち',
        '身の回りの世話':'身の回りの<br>世話',
        '足で踏まれる':'足で<br>踏まれる',
        'おもちゃ責め':'おもちゃ<br>責め',
        '言葉責め':'言葉<br>責め',
        '罰ゲーム':'罰<br>ゲーム'
      };
      if (specials[item]) return specials[item];
      const delimiters = ['、','・','（','／','/'];
      for (const d of delimiters){
        const idx = item.indexOf(d);
        if (idx > 1 && idx < item.length - 1){
          if (d === '（') return escapeHtml(item.slice(0, idx)) + '<br>' + escapeHtml(item.slice(idx));
          return escapeHtml(item.slice(0, idx + 1)) + '<br>' + escapeHtml(item.slice(idx + 1));
        }
      }
      if (item.length <= 5) return escapeHtml(item);
      const mid = Math.ceil(item.length / 2);
      return escapeHtml(item.slice(0, mid)) + '<br>' + escapeHtml(item.slice(mid));
    }
    function nextTapScore(score){
      if(score === 0) return 20;
      if(score <= 25) return 60;
      if(score <= 75) return 100;
      return 0;
    }
    function tone(score){
      if(score >= 76) return 'tone-red';
      if(score >= 26) return 'tone-yellow';
      if(score > 0) return 'tone-blue';
      return 'tone-empty';
    }
    function label(score){
      if(score === 0) return '未入力';
      if(score <= 25) return score + '｜青：できない';
      if(score <= 75) return score + '｜黄：妄想ならあり';
      return score + '｜赤：興奮する';
    }
    function uiColor(score){
      if(score >= 76) return '#f26b78';
      if(score >= 26) return '#f1c84d';
      if(score > 0) return '#6da6ff';
      return '#c9c9d6';
    }
    function fillHeight(score){
      if(score === 0) return 0;
      return Math.max(12, Math.round(score * 0.72));
    }
    function bottleSvg(score){
      const h = fillHeight(score);
      const y = 90 - h;
      const fill = uiColor(score);
      svgClipSeq += 1;
      const clipId = 'bottleClip' + svgClipSeq;
      return `
        <svg class="bottle-svg" viewBox="0 0 88 110" aria-hidden="true">
          <defs>
            <clipPath id="${clipId}">
              <path d="M23 52c0-6 2-10 6-14 4-4 7-7 7-11V19h16v8c0 4 3 7 7 11 4 4 6 8 6 14v34c0 9-6 15-15 15H38c-9 0-15-6-15-15V52z"></path>
            </clipPath>
          </defs>
          <rect x="31" y="7" width="26" height="10" rx="3" fill="#52525b"></rect>
          <path d="M34 16h20v11c0 3 4 6 8 10 4 3 7 8 7 15v36c0 10-7 17-17 17H36c-10 0-17-7-17-17V52c0-7 3-12 7-15 4-4 8-7 8-10V16z" fill="#fff" stroke="#2d2d2d" stroke-width="3"/>
          <g clip-path="url(#${clipId})">
            <rect x="20" y="${y}" width="48" height="${h}" fill="${fill}" opacity=".88"></rect>
          </g>
          <path d="M28 22v68" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
          <path d="M52 20v74" stroke="rgba(255,255,255,.26)" stroke-width="2" stroke-linecap="round"/>
          <path d="M34 16h20" stroke="#2d2d2d" stroke-width="2"/>
        </svg>`;
    }
    function renderBottle(group,item){
      const key = keyOf(group.cat,item);
      const score = state[key];
      return `
        <div class="bottle-card ${tone(score)}">
          <button type="button" class="bottle-btn" data-key="${escapeHtml(key)}" data-item="${escapeHtml(item)}">
            ${bottleSvg(score)}
            <div class="bottle-name">${escapeHtml(item)}</div>
            <div class="bottle-score">${escapeHtml(label(score))}</div>
          </button>
        </div>`;
    }

    function render(){
      groupArea.innerHTML = '';
      groups.forEach(group => {
        if(filter !== 'all' && filter !== group.cat) return;
        const section = document.createElement('section');
        section.className = 'group';
        section.innerHTML = `
          <div class="group-title"><span class="heart">♡</span>${escapeHtml(group.cat)}</div>
          <div class="grid">${group.items.map(item => renderBottle(group,item)).join('')}</div>`;
        groupArea.appendChild(section);
      });
      bindBottleEvents();
      updateResult();
      renderPoster();
    }

    function bindBottleEvents(){
      document.querySelectorAll('.bottle-btn').forEach(btn => {
        btn.addEventListener('contextmenu', e => e.preventDefault());
        btn.addEventListener('pointerdown', e => {
          e.preventDefault();
          activeKey = btn.dataset.key;
          startAt = Date.now();
          wasLong = false;
          btn.setPointerCapture(e.pointerId);
          btn.classList.add('holding');
          timer = window.setInterval(() => {
            const ms = Date.now() - startAt;
            if(ms < 320) return;
            wasLong = true;
            state[activeKey] = Math.min(100, Math.max(1, Math.round(ms / 18)));
            refreshButton(btn);
            updateResult();
            renderPoster();
          }, 70);
        });
        btn.addEventListener('pointerup', () => finishInput(btn));
        btn.addEventListener('pointercancel', () => finishInput(btn));
        btn.addEventListener('keydown', e => {
          if(e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          const key = btn.dataset.key;
          state[key] = nextTapScore(state[key]);
          render();
        });
      });
    }
    function finishInput(btn){
      if(!activeKey) return;
      clearInterval(timer);
      if(wasLong){
        state[activeKey] = Math.min(100, Math.max(1, Math.round((Date.now() - startAt) / 18)));
      } else {
        state[activeKey] = nextTapScore(state[activeKey]);
      }
      activeKey = '';
      btn.classList.remove('holding');
      render();
    }
    function refreshButton(btn){
      const key = btn.dataset.key;
      const item = btn.dataset.item;
      const score = state[key];
      const card = btn.closest('.bottle-card');
      card.className = 'bottle-card ' + tone(score);
      btn.innerHTML = `${bottleSvg(score)}<div class="bottle-name">${escapeHtml(item)}</div><div class="bottle-score">${escapeHtml(label(score))}</div>`;
    }

    function categoryScores(){
      return groups.map(group => {
        const total = group.items.length;
        const vals = group.items.map(item => state[keyOf(group.cat,item)]);
        const selected = vals.filter(v => v > 0);
        const red = vals.filter(v => v >= 76).length;
        const yellow = vals.filter(v => v >= 26 && v <= 75).length;
        const blue = vals.filter(v => v > 0 && v <= 25).length;
        const sum = vals.reduce((a,b)=>a+b,0);
        const density = total ? (sum / total) : 0;            // 0-100
        const coverage = total ? (selected.length / total * 100) : 0;   // 0-100
        const peak = vals.length ? Math.max(...vals) : 0;     // 0-100
        const raw = Math.round(density * 0.55 + coverage * 0.25 + peak * 0.20);  // 0-100想定
        return {cat:group.cat,total,selected:selected.length,red,yellow,blue,sum,density,coverage,peak,raw};
      }).sort((a,b) => b.raw - a.raw);
    }

    function normalizedScores(rows){
      const max = Math.max(0, ...rows.map(r => r.raw));
      return rows.map(r => ({...r, score: max > 0 ? Math.round(r.raw / max * 100) : 0 }));
    }

    function allItems(){
      const red=[], yellow=[], blue=[];
      groups.forEach(group => group.items.forEach(item => {
        const v = state[keyOf(group.cat,item)];
        if(v >= 76) red.push({cat:group.cat,item,score:v});
        else if(v >= 26) yellow.push({cat:group.cat,item,score:v});
        else if(v > 0) blue.push({cat:group.cat,item,score:v});
      }));
      return {red,yellow,blue};
    }

    function topCategories(norm){
      return norm.filter(r => r.selected > 0).slice(0,3);
    }


    function smLabel(){
      if(smTrait === 'S') return 'S気質';
      if(smTrait === 'M') return 'M気質';
      if(smTrait === 'Mix') return 'S/M両面型';
      return '気質未選択';
    }

    function genderLabel(){
      if(genderTrait === 'male') return '男性';
      if(genderTrait === 'female') return '女性';
      if(genderTrait === 'other') return 'その他・未回答';
      return '性別未選択';
    }

    function redCatCount(picks, cats){
      return picks.red.filter(x => cats.includes(x.cat)).length;
    }

    function yellowCatCount(picks, cats){
      return picks.yellow.filter(x => cats.includes(x.cat)).length;
    }

    function redItemCount(picks, items){
      return picks.red.filter(x => items.includes(x.item)).length;
    }

    function smDepthScore(info, picks){
      if(!info || !picks) return 0;
      const mCats = ['最下層マン','被虐マン','オナホマン','主従マン','首輪マン','管理マン'];
      const sCats = ['管理マン','主従マン','首輪マン','表露マン','露出マン','背徳愛マン'];
      const sItems = ['言葉責め','しつけ','お仕置き','絶頂管理','行動報告','下着管理','会話チェック','服装管理','罰ゲーム','羞恥お使い','公衆での羞恥会話','束縛','焦らし','寸止め'];
      const mItems = ['奴隷','謝罪','足で踏まれる','土下座','最下層奉仕','犬扱い','首輪（リード）','ご奉仕','拘束','束縛','焦らし','寸止め','SEX懇願'];

      let score = Math.min(45, info.redTotal * 4) + Math.min(25, info.yellowTotal * 2);
      if(smTrait === 'S'){
        score += redCatCount(picks, sCats) * 6 + redItemCount(picks, sItems) * 5;
      } else if(smTrait === 'M'){
        score += redCatCount(picks, mCats) * 6 + redItemCount(picks, mItems) * 5;
      } else if(smTrait === 'Mix'){
        score += Math.min(30, redCatCount(picks, sCats) * 4) + Math.min(30, redCatCount(picks, mCats) * 4);
      } else {
        score += 0;
      }
      if(info.focus === '集中') score += 8;
      if(info.intensity === '濃厚') score += 12;
      if(info.intensity === '強め') score += 6;
      return Math.max(0, Math.min(100, Math.round(score)));
    }

    function smDepthLabel(info, picks){
      if(!info || !picks) return smTrait ? '未診断' : '気質未選択';
      const score = smDepthScore(info, picks);
      if(!smTrait) return '気質未選択';
      if(smTrait === 'S'){
        if(score >= 82) return 'ドS寄り';
        if(score >= 62) return '強S寄り';
        if(score >= 38) return 'S寄り';
        return 'ライトS';
      }
      if(smTrait === 'M'){
        if(score >= 82) return 'ドM寄り';
        if(score >= 62) return '強M寄り';
        if(score >= 38) return 'M寄り';
        return 'ライトM';
      }
      if(score >= 78) return '攻守反転かなり強め';
      if(score >= 55) return '攻守反転型';
      if(score >= 34) return '気分で反転型';
      return 'ライト両面型';
    }

    function profileTitlePrefix(info, picks){
      const depth = info && picks ? smDepthLabel(info, picks) : smLabel();
      if(depth === 'ドS寄り' && genderTrait === 'female') return 'ドS小悪魔の';
      if(depth === 'ドS寄り' && genderTrait === 'male') return '支配濃度高めの';
      if(depth === 'ドM寄り' && genderTrait === 'male') return 'ドMロイヤルな';
      if(depth === 'ドM寄り' && genderTrait === 'female') return '深層委託の';
      if(depth === '強S寄り' && genderTrait === 'female') return '小悪魔采配の';
      if(depth === '強M寄り' && genderTrait === 'male') return '従属ロイヤルな';

      if(smTrait === 'S' && genderTrait === 'male') return '支配欲を香らせる';
      if(smTrait === 'S' && genderTrait === 'female') return '小悪魔采配の';
      if(smTrait === 'M' && genderTrait === 'male') return '従属ロイヤルな';
      if(smTrait === 'M' && genderTrait === 'female') return '愛され委託の';
      if(smTrait === 'Mix' && genderTrait === 'male') return '攻守反転の';
      if(smTrait === 'Mix' && genderTrait === 'female') return '甘辛反転の';
      if(smTrait === 'S') return '支配開花の';
      if(smTrait === 'M') return '委託陶酔の';
      if(smTrait === 'Mix') return '反転両面の';
      return '';
    }

    function profileMood(){
      const sm = {
        S:'相手の反応を引き出すことに快感が寄りやすく、主導権を握るほど色気が増す',
        M:'相手に委ねることで安心と興奮が重なり、選ばれて扱われるほど深く沈みやすい',
        Mix:'相手の強さや空気によって、攻めたい欲と委ねたい欲が入れ替わりやすい'
      }[smTrait] || 'S/M気質が未選択なので、瓶そのものの傾向を中心に出しています';

      const gender = {
        male:'男性側の欲として、強がり・独占欲・主導権への意識が裏側に混ざりやすい',
        female:'女性側の欲として、安心感・特別扱い・主導権を握る色気が出方に混ざりやすい',
        other:'性別の型よりも、相手との関係性や空気でスイッチが決まりやすい'
      }[genderTrait] || '性別が未選択なので、男女どちらにも寄せすぎずに読んでいます';

      return {sm, gender};
    }

    function profileOneLine(){
      if(smTrait === 'S' && genderTrait === 'male') return '攻めたい欲の奥に、相手を自分色に染めたい独占欲が見えます。';
      if(smTrait === 'S' && genderTrait === 'female') return '可愛く見せながら、実は主導権を握りたい小悪魔性が出ています。';
      if(smTrait === 'M' && genderTrait === 'male') return '強がりの奥に、信頼できる相手へ主導権を渡したい甘さがあります。';
      if(smTrait === 'M' && genderTrait === 'female') return '大切に選ばれたうえで崩されたい、愛情確認型のM気質が出ています。';
      if(smTrait === 'Mix' && genderTrait === 'male') return '場面によって攻めにも受けにも変わる、相手依存の反転気質です。';
      if(smTrait === 'Mix' && genderTrait === 'female') return '甘えたい日と試したい日が入れ替わる、揺れ幅のある魅力です。';
      if(smTrait === 'S') return '相手の反応を見て、自分の中のスイッチも強くなるタイプです。';
      if(smTrait === 'M') return '安心できる相手にだけ、深く委ねる温度が出やすいタイプです。';
      if(smTrait === 'Mix') return '相手次第で攻守が変わる、固定されないタイプです。';
      return 'S/M気質と性別を選ぶと、ここがさらにあなた向けに変わります。';
    }

    function genderSmReading(info, picks){
      if(!info || !picks) return '瓶を選ぶと、性別とS/M気質を合わせた読み取りが表示されます。';
      const depth = smDepthLabel(info, picks);
      if(genderTrait === 'male' && smTrait === 'M'){
        return `${depth}の男性として読むと、表では強く見せたい部分と、深いところで主導権を預けたい部分のギャップが魅力です。これは弱さではなく、信頼した相手にだけ見せる“裏の甘さ”です。`;
      }
      if(genderTrait === 'female' && smTrait === 'S'){
        return `${depth}の女性として読むと、ただ強いだけではなく、相手の反応を見て温度を上げていく小悪魔性が出ています。可愛さの奥に、主導権を握るセンスがあります。`;
      }
      if(genderTrait === 'male' && smTrait === 'S'){
        return `${depth}の男性として読むと、独占欲や守りたい感覚が支配欲と混ざりやすいタイプです。強引さよりも、相手が自分に染まっていく過程に満足しやすいでしょう。`;
      }
      if(genderTrait === 'female' && smTrait === 'M'){
        return `${depth}の女性として読むと、安心できる相手にだけ深く委ねたい、愛情確認型の甘さが出ています。雑に扱われたいのではなく、選ばれて崩されたいタイプです。`;
      }
      if(smTrait === 'Mix'){
        return `${depth}として読むと、SかMかを固定すると浅くなります。相手の強さ、空気、言葉の温度によって、攻めたい日と委ねたい日が入れ替わるタイプです。`;
      }
      return `${depth}として、瓶の選び方から気質の濃さを推定しています。`;
    }

    function patternInfo(norm, picks){
      const active = norm.filter(r => r.selected > 0);
      const redTotal = picks.red.length;
      const yellowTotal = picks.yellow.length;
      const blueTotal = picks.blue.length;

      const totalDone = picks.red.length + picks.yellow.length + picks.blue.length;
      if(!active.length){
        return {
          type:'未診断',
          hint:'瓶を選んでください',
          html:'まだ瓶が選ばれていません。',
          bars:ranked,
          picks,
          info:null,
          top:{cat:'未診断',score:0},
          second:{cat:'未診断',score:0},
          third:{cat:'未診断',score:0}
        };
      }

      const top = active[0];
      const second = active[1] || active[0];
      const third = active[2] || active[1] || active[0];
      const info = patternInfo(ranked, picks);
      const title = archetype(top, second, info);
      const summary = openingSentence(top, second, third, info);
      const deep = deepBlocks(top, second, third, info, picks);
      const params = parameterBars(ranked, picks, info);
      const lucky = luckyItem(top, info);
      const partner = partnerType(top, second, info);
      const warning = info.responseRate < 15 ? `※回答率は ${info.responseRate}% です。まだ少なめなので、今の結果は“暫定オラクル”です。` : '';

      const html = `
        <div class="oracle-card">
          <div class="oracle-inner">
            <div class="oracle-kicker">【性癖鑑定結果】</div>
            <div class="oracle-main-title">${escapeHtml(title)}</div>
            <div class="profile-chips"><span class="profile-chip">${escapeHtml(smLabel())}</span><span class="profile-chip">${escapeHtml(genderLabel())}</span><span class="profile-chip">${escapeHtml(smDepthLabel(info, picks))}</span></div>
            <p class="oracle-summary">${escapeHtml(summary)}</p>
            ${warning ? `<p style="margin:0 0 10px;color:#f9d7dc;font-weight:700">${escapeHtml(warning)}</p>` : ''}

            <div class="section-label">📊 気質パラメーター</div>
            <div class="mini-stats">
              ${params.map(p => `
                <div class="mini-row">
                  <div class="top"><span>${escapeHtml(p.name)}</span><span>${p.value} / 100</span></div>
                  <div class="mini-track"><div class="mini-fill" style="width:${p.value}%"></div></div>
                  <div style="font-size:.82rem;color:#d4ddff">${escapeHtml(p.note)}</div>
                </div>`).join('')}
            </div>

            <div class="section-label">🔎 深層心理分析</div>
            <div class="insight-grid">
              <div class="insight-box">
                <h4>${escapeHtml(deep.t1)}</h4>
                <p>${escapeHtml(deep.p1)}</p>
              </div>
              <div class="insight-box">
                <h4>${escapeHtml(deep.t2)}</h4>
                <p>${escapeHtml(deep.p2)}</p>
              </div>
              <div class="insight-box">
                <h4>性別×気質の読み取り</h4>
                <p>${escapeHtml(genderSmReading(info, picks))}</p>
              </div>
              <div class="insight-box">
                <h4>🤖 AI診断コメント</h4>
                <p>${escapeHtml(deep.ai)}</p>
              </div>
            </div>

            <div class="bottom-picks">
              <div class="pick"><div class="cap">✨ ラッキーアイテム</div><div class="txt">${escapeHtml(lucky)}</div></div>
              <div class="pick"><div class="cap">🤝 相性の良いタイプ</div><div class="txt">${escapeHtml(partner)}</div></div>
            </div>
          </div>
        </div>`;

      const type = title;
      const hint = `最上位：${top.cat}｜相対スコア100`;
      return {type,hint,html,bars:ranked,picks,top,second,third,info};
    }

    function updateResult(){
      const result = resultMarkup();
      const red = result.picks.red.length;
      const blue = result.picks.blue.length;
      const done = red + result.picks.yellow.length + blue;

      document.getElementById('redCount').textContent = red;
      document.getElementById('blueCount').textContent = blue;
      document.getElementById('doneCount').textContent = '入力済み ' + done;
      document.getElementById('typeName').textContent = result.type;
      document.getElementById('typeHint').textContent = result.hint;
      document.getElementById('resultText').innerHTML = result.html;

      document.getElementById('categoryBars').innerHTML = result.bars.map(row => `
        <div>
          <div class="bar-head">
            <span>${escapeHtml(row.cat)} ${row.selected}/${row.total}件｜赤${row.red} 黄${row.yellow} 青${row.blue}</span>
            <span>${row.score}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${row.score}%"></div></div>
        </div>`).join('');
    }

    function shareText(){
      const result = resultMarkup();
      if(result.type === '未診断'){
        document.getElementById('shareText').value = 'まだ診断結果がありません。';
        return;
      }
      const topReds = result.picks.red.slice(0,6).map(x => x.item).join('、') || 'なし';
      const topYellows = result.picks.yellow.slice(0,6).map(x => x.item).join('、') || 'なし';
      const text = [
        '性癖の瓶メーカー診断結果',
        '',
        'タイプ：' + result.type,
        '気質：' + smLabel(),
        '性別：' + genderLabel(),
        '推定：' + smDepthLabel(result.info, result.picks),
        '推定：' + smDepthLabel(result.info, result.picks),
        '強め：' + result.top.cat + ' / ' + result.second.cat,
        '赤い瓶：' + topReds,
        '黄色い瓶：' + topYellows,
        '相性の良いタイプ：' + partnerType(result.top, result.second, result.info),
        '',
        'ひとこと：' + profileOneLine(),
        '',
        '※成人同士の同意・安全・合法が前提の娯楽用診断'
      ].join('\n');
      const area = document.getElementById('shareText');
      area.value = text;
      area.focus();
      area.select();
    }

    function cleanAppUrl(){
      const url = new URL(location.href);
      url.hash = '';
      url.searchParams.delete('v');
      return url.toString();
    }

    function resultMessageForLine(){
      const result = resultMarkup();
      const appUrl = cleanAppUrl();
      if(result.type === '未診断'){
        return ['これ試してみて','性癖の瓶メーカー',appUrl].join('\n');
      }
      const topReds = result.picks.red.slice(0,6).map(x => x.item).join('、') || 'なし';
      return [
        '性癖の瓶メーカー診断結果',
        '',
        'タイプ：' + result.type,
        '気質：' + smLabel(),
        '性別：' + genderLabel(),
        '強め：' + result.top.cat + ' / ' + result.second.cat,
        '赤い瓶：' + topReds,
        '相性の良いタイプ：' + partnerType(result.top, result.second, result.info),
        '',
        'ひとこと：' + profileOneLine(),
        '',
        'あなたもやってみて',
        appUrl,
        '',
        '※成人同士の同意・安全・合法が前提の娯楽用診断'
      ].join('\n');
    }

    async function copyTextForLine(text){
      const status = document.getElementById('copyStatus');
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(text);
        }else{
          const tmp = document.createElement('textarea');
          tmp.value = text;
          tmp.style.position = 'fixed';
          tmp.style.left = '-9999px';
          document.body.appendChild(tmp);
          tmp.focus();
          tmp.select();
          document.execCommand('copy');
          document.body.removeChild(tmp);
        }
        if(status) status.textContent = 'コピーしました。LINEに貼り付けてください。';
      }catch(e){
        const area = document.getElementById('shareText');
        if(area){
          area.value = text;
          area.focus();
          area.select();
        }
        if(status) status.textContent = '下の欄に表示しました。選択してコピーしてください。';
      }
    }


    function renderPoster(){
      const result = resultMarkup();
      const picks = allItems();
      const redCount = picks.red.length;
      const yellowCount = picks.yellow.length;
      const blueCount = picks.blue.length;
      const depth = smDepthLabel(result.info, result.picks);
      const depthText = (result.type === '未診断' || depth === '未診断' || depth === '気質未選択')
        ? '瓶を選ぶと気質が出ます'
        : `あなたは${depth}です`;

      const colHtml = groups.map(group => `
        <div class="poster-col">
          <div class="poster-cat">${escapeHtml(group.cat)}</div>
          ${group.items.map(item => {
            const score = state[keyOf(group.cat,item)];
            const height = score === 0 ? 0 : (score >= 76 ? 92 : score >= 26 ? 65 : 38);
            const fill = score >= 76 ? '#ef4444' : score >= 26 ? '#facc15' : score > 0 ? '#3b82f6' : 'transparent';
            return `
              <div class="poster-bottle">
                <div class="cap"></div>
                <div class="neck"></div>
                <div class="body">
                  <div class="fill" style="height:${height}%;background:${fill}"></div>
                  <div class="glass"></div>
                </div>
                <div class="label">${formatBottleLabel(item)}</div>
              </div>`;
          }).join('')}
        </div>`).join('');

      document.getElementById('poster').className = 'poster';
      document.getElementById('poster').innerHTML = `
        <div class="poster-shot-head">
          <div>
            <div class="poster-shot-title">性癖の瓶メーカー</div>
            <div class="poster-shot-sub">赤い瓶・青い瓶 一覧結果</div>
          </div>
          <div class="poster-shot-meta">
            <span>${escapeHtml(smLabel())}</span>
            <span>${escapeHtml(genderLabel())}</span>
            <span>赤${redCount}</span>
            <span>黄${yellowCount}</span>
            <span>青${blueCount}</span>
          </div>
        </div>

        <div class="poster-shot-result">
          <div class="result-box">
            <div class="cap">診断タイプ</div>
            <div class="main">${escapeHtml(result.type)}</div>
          </div>
          <div class="result-box">
            <div class="cap">気質結果</div>
            <div class="main depth">${escapeHtml(depthText)}</div>
          </div>
        </div>

        <div class="poster-grid">${colHtml}</div>
        <div class="poster-foot">
          <span>赤：興奮する　黄：妄想ならあり　青：できない　白：未入力</span>
          <span>成人同士の同意・安全・合法が前提の娯楽用診断</span>
        </div>`;
    }


    document.querySelectorAll('.sm-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        smTrait = btn.dataset.sm;
        document.querySelectorAll('.sm-btn').forEach(b => b.classList.toggle('active', b === btn));
        updateResult();
        renderPoster();
      });
    });

    document.querySelectorAll('.gender-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        genderTrait = btn.dataset.gender;
        document.querySelectorAll('.gender-btn').forEach(b => b.classList.toggle('active', b === btn));
        updateResult();
        renderPoster();
      });
    });

    filterSelect.addEventListener('change', e => { filter = e.target.value; render(); });
    document.getElementById('resetBtn').addEventListener('click', () => {
      Object.keys(state).forEach(key => state[key] = 0);
      document.getElementById('shareText').value = '共有文を作成するとここに表示されます。';
      render();
    });
    document.getElementById('shareBtn').addEventListener('click', shareText);
    document.getElementById('lineAppBtn').addEventListener('click', () => {
      copyTextForLine(`これ試してみて\n性癖の瓶メーカー\n${cleanAppUrl()}`);
    });
    document.getElementById('lineResultBtn').addEventListener('click', () => {
      copyTextForLine(resultMessageForLine());
    });
    document.getElementById('posterBtn').addEventListener('click', () => {
      renderPoster();
      document.getElementById('screenPanel').classList.remove('hidden');
      document.getElementById('screenPanel').scrollIntoView({behavior:'smooth',block:'start'});
    });
    document.getElementById('backBtn').addEventListener('click', () => {
      document.getElementById('screenPanel').classList.add('hidden');
      window.scrollTo({top:0,behavior:'smooth'});
    });
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    render();
  </script>
</body>
</html>
