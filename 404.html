<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>性癖の瓶メーカー｜診断強化版 v7.1</title>
  <meta name="description" content="LINEで送って遊べる、赤い瓶・青い瓶のオラクル鑑定アプリ">
  <meta property="og:title" content="性癖の瓶メーカー">
  <meta property="og:description" content="赤い瓶・青い瓶であなたの傾向をオラクル鑑定します。">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="description" content="LINEで送って遊べる、赤い瓶・青い瓶のオラクル鑑定アプリ">
  <meta property="og:title" content="性癖の瓶メーカー">

  <meta name="description" content="赤い瓶・青い瓶で傾向を鑑定するオラクル風Webアプリ">
  <style>
    :root{
      --bg:#fbf1f6;
      --panel:#ffffff;
      --text:#241824;
      --muted:#746874;
      --line:#efcadc;
      --accent:#d94d98;
      --accent-soft:#fff0f7;
      --blue:#6da6ff;
      --yellow:#f1c84d;
      --red:#f26b78;
      --dark:#0d1636;
      --dark2:#121f49;
      --dark3:#18275a;
      --ink:#eef2ff;
      --shadow:0 12px 30px rgba(214,93,159,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#fbe7f2 0,#fbf1f6 220px);
      color:var(--text);
      line-height:1.6;
    }
    main{width:min(1200px,calc(100% - 18px));margin:0 auto;padding:18px 0 42px}
    h1{margin:0;font-size:clamp(2rem,5vw,3rem);line-height:1.1}
    .sub{color:var(--muted);margin:.4rem 0 0}
    .panel,.metric,.result-wrap,.poster-wrap{
      background:rgba(255,255,255,.92);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
    }
    .panel{padding:16px;margin:14px 0}
    .top-note{background:linear-gradient(90deg,#fff,var(--accent-soft));border-left:6px solid var(--accent)}
    .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .legend div{padding:10px 12px;border-radius:14px;border:1px solid var(--line);font-weight:800}
    .legend .blue{background:#dce9ff}
    .legend .yellow{background:#fff2c7}
    .legend .red{background:#ffe2e6}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
    button,select{
      font:inherit;border:1px solid var(--line);background:#fff;color:var(--text);
      border-radius:14px;padding:10px 14px
    }
    button{cursor:pointer}
    button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800}
    #lineAppBtn,#lineResultBtn{border-color:#06c755;font-weight:800;color:#075d2b;background:#effff5}
    .copy-status{font-size:.9rem;color:#075d2b;font-weight:800}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
    .metric{padding:14px}
    .metric .label{font-size:.84rem;color:var(--muted)}
    .metric .value{font-size:1.7rem;font-weight:900;line-height:1.15}
    .metric .hint{font-size:.84rem;color:var(--muted)}
    .group{margin:24px 0}
    .group-title{display:flex;align-items:center;gap:8px;font-weight:900;margin-bottom:10px}
    .group-title .heart{color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
    .bottle-card{
      min-height:152px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;
      transition:.12s transform,.12s border-color,.12s box-shadow,.12s background;
    }
    .bottle-card:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 8px 20px rgba(214,93,159,.12)}
    .tone-empty{background:#fff}
    .tone-blue{background:#dce9ff}
    .tone-yellow{background:#fff2c7}
    .tone-red{background:#ffe2e6}
    .bottle-btn{
      width:100%;min-height:132px;background:transparent;border:0;padding:0;
      display:grid;place-items:center;gap:6px;color:var(--text);
      user-select:none;-webkit-user-select:none;touch-action:none
    }
    .bottle-visual{
      position:relative;
      width:76px;
      height:90px;
      display:grid;
      place-items:center;
    }
    .bottle-inner-label{display:none}
    
    .bottle-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
    .holding{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
    .bottle-svg{width:76px;height:90px;display:block}
    .bottle-name{font-size:.94rem;font-weight:1000;line-height:1.08;text-align:center;overflow-wrap:anywhere;display:block;max-width:100%}
    .bottle-score{font-size:.74rem;color:var(--muted);text-align:center}
    .result-wrap{padding:18px;margin-top:24px}
    .result-title{font-size:1.5rem;font-weight:900;margin:0 0 12px}
    .oracle-card{
      background:linear-gradient(180deg,#0a1431,#12204b);
      color:var(--ink);
      border-radius:22px;
      border:1px solid #35457f;
      padding:18px;
      box-shadow:0 18px 40px rgba(10,20,49,.28);
      position:relative;
      overflow:hidden;
    }
    .oracle-card::before,.oracle-card::after{
      content:"";
      position:absolute;border-radius:999px;filter:blur(20px);opacity:.18
    }
    .oracle-card::before{width:180px;height:180px;background:#b14cff;top:-50px;left:-40px}
    .oracle-card::after{width:220px;height:220px;background:#1c9fff;bottom:-80px;right:-50px}
    .oracle-inner{position:relative;z-index:1}
    .oracle-kicker{font-size:1rem;font-weight:900;letter-spacing:.04em;color:#f5d8ff;text-align:center}
    .oracle-main-title{
      font-size:clamp(1.6rem,4vw,2.5rem);font-weight:1000;text-align:center;line-height:1.15;
      color:#f7cbff;margin:8px 0 12px
    }
    .oracle-summary{font-size:1rem;color:#eef1ff;margin:0 0 16px}
    .section-label{
      font-size:.96rem;font-weight:900;color:#cfe0ff;display:flex;align-items:center;gap:8px;margin:12px 0 10px
    }
    .insight-grid{display:grid;grid-template-columns:1fr;gap:10px}
    .insight-box{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(189,203,255,.18);
      border-radius:16px;
      padding:14px
    }
    .insight-box h4{margin:0 0 6px;font-size:1.04rem;color:#ffffff}
    .insight-box p{margin:0;color:#e6ebff}
    .mini-stats{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
    .mini-row{display:grid;gap:4px}
    .mini-row .top{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;color:#f2f4ff}
    .mini-track{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
    .mini-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7ca8ff,#d85eff)}
    .bottom-picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .pick{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(189,203,255,.18);
      border-radius:16px;
      padding:14px;
      min-height:86px
    }
    .pick .cap{font-size:.85rem;color:#c7d6ff;font-weight:800}
    .pick .txt{font-size:1.04rem;font-weight:900;color:#fff;line-height:1.3;margin-top:4px}
    .bars{margin-top:18px;display:grid;gap:10px}
    .bar-head{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-bottom:4px}
    .bar-track{height:11px;border-radius:999px;background:#eedee7;overflow:hidden}
    .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#f5be41,#f04b72)}
    textarea{
      width:100%;min-height:118px;border:1px solid var(--line);background:#fff;border-radius:14px;
      padding:12px;font:inherit;resize:vertical
    }

    /* Screenshot board */
    .screen-panel{margin-top:22px}
    .screen-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
    .poster-wrap{padding:12px;overflow:auto}
    .poster{
      width:1150px;background:#fff;border-radius:12px;padding:18px 16px 22px;color:#151515
    }
    .poster-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .poster-title{font-size:32px;font-weight:1000;line-height:1.1}
    .poster-sub{font-size:14px;color:#666;margin-top:3px}
    .poster-legend{display:grid;gap:4px;font-size:18px;font-weight:900}
    .poster-legend .r{color:#ef4444}.poster-legend .y{color:#ca8a04}.poster-legend .b{color:#2563eb}
    .poster-summary{
      margin:8px 0 14px;padding:8px 10px;border:2px solid #f2bad4;background:#fff0f7;border-radius:12px;
      display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800
    }
    .poster-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;align-items:start}
    .poster-col{display:grid;gap:6px}
    .poster-cat{
      min-height:40px;border:2px solid #f3b7d3;border-radius:999px;background:#fff7fb;padding:4px;
      display:grid;place-items:center;text-align:center;font-size:13px;font-weight:900;line-height:1.1
    }
    .poster-bottle{
      height:64px;position:relative;padding:0 3px 4px
    }
    .poster-bottle .neck{
      position:absolute;left:50%;top:0;transform:translateX(-50%);width:22px;height:10px;background:#fff;
      border:2px solid #222;border-bottom:0;border-radius:6px 6px 0 0;z-index:3
    }
    .poster-bottle .cap{
      position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:26px;height:6px;background:#444;
      border-radius:4px;z-index:4
    }
    .poster-bottle .body{
      position:absolute;left:2px;right:2px;top:8px;bottom:0;background:#fff;border:2px solid #222;border-radius:12px 12px 16px 16px;overflow:hidden
    }
    .poster-bottle .glass{
      position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,255,255,0) 20%,rgba(255,255,255,.17) 78%,rgba(255,255,255,0))
    }
    .poster-bottle .fill{
      position:absolute;left:0;right:0;bottom:0;height:0;background:#fff;opacity:.88
    }
    .poster-bottle .label{
      position:absolute;left:5px;right:5px;top:16px;bottom:6px;display:-webkit-box;
      -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
      text-align:center;font-size:13.6px;line-height:.96;font-weight:1000;z-index:5;
      align-items:center;justify-content:center;
      word-break:keep-all;overflow-wrap:anywhere;
      text-shadow:0 1px 0 rgba(255,255,255,.97),1px 0 0 rgba(255,255,255,.90),-1px 0 0 rgba(255,255,255,.90)
    }
    .poster-foot{margin-top:12px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#666}
    .hidden{display:none!important}
    .poster-only .main-app{display:none}
    .poster-only .poster-wrap{padding:0;border:none;box-shadow:none;overflow:visible}
    .poster-only .poster{width:1150px;border-radius:0}
    .poster-only main{width:100%;padding:0}
    .poster-only .screen-tools{padding:10px;background:#fff;position:sticky;top:0;z-index:9}
    @media(max-width:980px){
      .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
      .metrics{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:640px){
      main{width:min(100% - 12px,1200px)}
      .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
      .bottle-card{min-height:132px;padding:6px}
      .bottle-btn{min-height:118px}
      .bottle-svg{width:68px;height:82px}
      .bottle-name{font-size:.94rem;font-weight:1000;line-height:1.08;text-align:center;overflow-wrap:anywhere;display:block;max-width:100%}
      .bottle-score{font-size:.66rem}
      .legend,.bottom-picks{grid-template-columns:1fr}
      .metrics{grid-template-columns:1fr 1fr}
      .poster{width:1120px}
    }
  </style>
</head>
<body>
  <main>
    <div class="main-app">
      <header>
        <h1>性癖の瓶メーカー</h1>
        <p class="sub">〜あなたの中の赤い瓶、青い瓶を分析します〜</p>
      </header>

      <section class="panel top-note">
        <strong>鑑定ロジック強化版 v7 です。診断結果をかなり長め・感情寄りに作り直しました。</strong>
        <p class="sub">タップで「未入力 → 青 → 黄 → 赤 → 未入力」。長押しなら細かく強さを入力できます。コメントは占いっぽく、エンタメ寄りに強化しました。</p>
        <div class="legend">
          <div class="blue">青：できない</div>
          <div class="yellow">黄：妄想ならあり</div>
          <div class="red">赤：興奮する</div>
        </div>
        <div class="controls">
          <select id="filter"><option value="all">全項目</option></select>
          <button id="resetBtn" type="button">リセット</button>
          <button id="shareBtn" type="button">共有文を作成</button>
          <button id="posterBtn" class="primary" type="button">スクショ用ボードを表示</button>
          <button id="lineAppBtn" type="button">アプリURLをコピー</button>
          <button id="lineResultBtn" type="button">診断結果をコピー</button><span id="copyStatus" class="copy-status"></span>
        </div>
      </section>

      <section class="metrics" aria-live="polite">
        <div class="metric"><div class="label">総合タイプ</div><div id="typeName" class="value">未診断</div><div id="typeHint" class="hint">瓶を選んでください</div></div>
        <div class="metric"><div class="label">赤い瓶</div><div id="redCount" class="value">0</div><div class="hint">興奮する</div></div>
        <div class="metric"><div class="label">青い瓶</div><div id="blueCount" class="value">0</div><div class="hint">できない</div></div>
        <div class="metric"><div class="label">総瓶数</div><div id="totalCount" class="value">105</div><div id="doneCount" class="hint">入力済み 0</div></div>
      </section>

      <section id="groupArea"></section>

      <section class="result-wrap">
        <h2 class="result-title">分析結果</h2>
        <div id="resultText">まだ瓶が選ばれていません。</div>
        <div id="categoryBars" class="bars"></div>
        <h3 style="margin:20px 0 8px;font-size:1.18rem">共有用コピー結果</h3>
        <textarea id="shareText" readonly>診断結果やLINEに貼り付ける文章がここに表示されます。</textarea>
      </section>
    </div>

    <section id="screenPanel" class="screen-panel hidden">
      <div class="screen-tools">
        <button id="backBtn" type="button">通常画面に戻る</button>
        <button id="posterOnlyBtn" type="button">スクショ専用表示</button>
        <button id="printBtn" type="button">印刷 / PDF保存</button>
      </div>
      <div class="poster-wrap">
        <div id="poster" class="poster"></div>
      </div>
    </section>
  </main>

  <script>
    // 古いキャッシュの影響を切る
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister())).catch(()=>{});
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))).catch(()=>{});
    }

    const groups = [
      {cat:'最下層マン',items:['奴隷','謝罪','足で踏まれる','身の回りの世話','服装の差','土下座','アナル、金玉舐め','重りをもって同じ姿勢','人間家具','荷物持ち','最下層奉仕']},
      {cat:'被虐マン',items:['アナル開発','タトゥー・ピアス','匂いザーメン中毒','貢ぎ','晒し','風俗堕ち','孕ませ','借金']},
      {cat:'オナホマン',items:['即ハメ','悪癖','口枷','貸し出し','呼び出し','生ハメ','ザーメンタンク','飲尿','浴尿','くい打ちピストン','男尊女卑']},
      {cat:'表露マン',items:['身体検査','罰ゲーム','淫語強制','全頭マスク','下品なポーズ','鼻フック','アヘオホ','立小便','性的いじめ','変態芸','宴会芸']},
      {cat:'管理マン',items:['絶頂管理','行動報告','下着管理','会話チェック','睡眠管理','服装管理','食事管理','排泄管理','髪型管理','金銭管理']},
      {cat:'ガチボコマン',items:['腹パン','噛み跡','はたく','蹴り','あざ']},
      {cat:'主従マン',items:['足かせ','お仕置き','犬扱い','帰宅後即奉仕','首輪（椅子に固定）','全身リップ','全裸飼育','檻','外の世界と隔離']},
      {cat:'首輪マン',items:['あまあま','言葉責め','首輪（リード）','ご奉仕','おもちゃ責め','焦らし','寸止め','首絞め','しつけ','拘束','束縛']},
      {cat:'フェチマン',items:['複数','コスプレ','落書き','パイパン','催眠','緊縛','体液','女体盛','母乳','イメプ','スカトロ']},
      {cat:'露出マン',items:['ネカフェでのプレイ','車中プレイ','遠隔ローター','ノーパンノーブラ','羞恥お使い','公衆での羞恥会話','露出度の高い衣装']},
      {cat:'背徳愛マン',items:['寝取られ','浮気SEX','叱られながら責められる','彼氏よりでかちんに責められる','彼氏の悪口','電話しながらH','自宅でH','SEX懇願','はめ撮り','彼氏とSEX禁止','不倫']}
    ];
    const state = {};
    let filter = 'all';
    let activeKey = '';
    let startAt = 0;
    let wasLong = false;
    let timer = 0;
    let svgClipSeq = 0;

    const groupArea = document.getElementById('groupArea');
    const filterSelect = document.getElementById('filter');
    groups.forEach(group => {
      group.items.forEach(item => state[keyOf(group.cat,item)] = 0);
      const opt = document.createElement('option');
      opt.value = group.cat;
      opt.textContent = group.cat;
      filterSelect.appendChild(opt);
    });

    function keyOf(cat,item){ return cat + '|' + item; }
    function escapeHtml(v){
      return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function formatBottleLabel(item){
      const specials = {
        'ノーパンノーブラ':'ノーパン<br>ノーブラ',
        'ネカフェでのプレイ':'ネカフェでの<br>プレイ',
        '彼氏よりでかちんに責められる':'彼氏よりでかちんに<br>責められる',
        '重りをもって同じ姿勢':'重りをもって<br>同じ姿勢',
        '首輪（椅子に固定）':'首輪<br>（椅子に固定）',
        '公衆での羞恥会話':'公衆での<br>羞恥会話',
        '叱られながら責められる':'叱られながら<br>責められる',
        '遠隔ローター':'遠隔<br>ローター',
        'アナル、金玉舐め':'アナル、<br>金玉舐め',
        '匂いザーメン中毒':'匂いザーメン<br>中毒',
        'タトゥー・ピアス':'タトゥー・<br>ピアス',
        '身体検査':'身体<br>検査',
        '行動報告':'行動<br>報告',
        '絶頂管理':'絶頂<br>管理',
        '睡眠管理':'睡眠<br>管理',
        '食事管理':'食事<br>管理',
        '金銭管理':'金銭<br>管理',
        '会話チェック':'会話<br>チェック',
        '下着管理':'下着<br>管理',
        '服装管理':'服装<br>管理',
        '排泄管理':'排泄<br>管理',
        '髪型管理':'髪型<br>管理',
        '全身リップ':'全身<br>リップ',
        '外の世界と隔離':'外の世界と<br>隔離',
        '電話しながらH':'電話しながら<br>H',
        '露出度の高い衣装':'露出度の高い<br>衣装',
        '風俗堕ち':'風俗<br>堕ち',
        '身の回りの世話':'身の回りの<br>世話',
        '足で踏まれる':'足で<br>踏まれる',
        'おもちゃ責め':'おもちゃ<br>責め',
        '言葉責め':'言葉<br>責め',
        '罰ゲーム':'罰<br>ゲーム'
      };
      if (specials[item]) return specials[item];
      const delimiters = ['、','・','（','／','/'];
      for (const d of delimiters){
        const idx = item.indexOf(d);
        if (idx > 1 && idx < item.length - 1){
          if (d === '（') return escapeHtml(item.slice(0, idx)) + '<br>' + escapeHtml(item.slice(idx));
          return escapeHtml(item.slice(0, idx + 1)) + '<br>' + escapeHtml(item.slice(idx + 1));
        }
      }
      if (item.length <= 5) return escapeHtml(item);
      const mid = Math.ceil(item.length / 2);
      return escapeHtml(item.slice(0, mid)) + '<br>' + escapeHtml(item.slice(mid));
    }
    function nextTapScore(score){
      if(score === 0) return 20;

    function categoryScores(){

        const red = vals.filter(v => v >= 76).length;
        const yellow = vals.filter(v => v >= 26 && v <= 75).length;
        const blue = vals.filter(v => v > 0 && v <= 25).length;
        const sum = vals.reduce((a,b)=>a+b,0);
        const density = total ? (sum / total) : 0;            // 0-100
        const coverage = total ? (selected.length / total * 100) : 0;   // 0-100
        const peak = vals.length ? Math.max(...vals) : 0;     // 0-100
        const raw = Math.round(density * 0.55 + coverage * 0.25 + peak * 0.20);  // 0-100想定
        return {cat:group.cat,total,selected:selected.length,red,yellow,blue,sum,density,coverage,peak,raw};

            <div class="section-label">📊 欲望パラメーター</div>
            <div class="mini-stats">
              ${params.map(p => `
                <div class="mini-row">
                  <div class="top"><span>${escapeHtml(p.name)}</span><span>${p.value} / 100</span></div>
                  <div class="mini-track"><div class="mini-fill" style="width:${p.value}%"></div></div>
                  <div style="font-size:.82rem;color:#d4ddff">${escapeHtml(p.note)}</div>
                </div>`).join('')}
            </div>

            <div class="section-label">🔮 深層心理鑑定</div>
            <div class="insight-grid">
              <div class="insight-box">
                <h4>本質：愛され方に条件がある人</h4>
                <p>${escapeHtml(desireAxis(top, second, info))}</p>
              </div>
              <div class="insight-box">
                <h4>赤い瓶の読み取り</h4>
                <p>${escapeHtml(itemText.redSentence)}</p>
              </div>
              <div class="insight-box">
                <h4>黄色い瓶と青い瓶の読み取り</h4>
                <p>${escapeHtml(itemText.yellowSentence)} ${escapeHtml(itemText.blueSentence)}</p>
              </div>
              <div class="insight-box">
                <h4>隠れた矛盾</h4>
                <p>${escapeHtml(contradictions[0])}</p>
              </div>
              <div class="insight-box">
                <h4>🤖 AI辛口診断コメント</h4>
                <p>${escapeHtml(makeSharpComment(top, second, info, picks))}</p>
              </div>
            </div>

            <div class="bottom-picks">
              <div class="pick"><div class="cap">✨ ラッキーアイテム</div><div class="txt">${escapeHtml(luckyItem(top, info))}</div></div>
              <div class="pick"><div class="cap">🤝 相性の良いタイプ</div><div class="txt">${escapeHtml(partnerType(top, second, info))}</div></div>
            </div>
          </div>
        </div>`;

      return {
        type:title,
        hint:`最上位：${top.cat}｜相対スコア100`,
        html,
        bars:ranked,
        picks,
        top,
        second,
        third,
        info
      };
    }

    function makeSharpComment(top, second, info, picks){
      if(info.redTotal === 0){
        return 'まだ本性を出していません。表向きは様子見ですが、黄色い瓶があるなら妄想の中ではもう何度か踏み込んでいます。';
      }
      if(info.focus === '横断'){
        return 'あなたは「私はこれが好き」と綺麗に説明できるタイプではありません。むしろ、その場の空気と相手の言葉で急にスイッチが入る危険な雑食性があります。自分では軽く選んだつもりでも、赤の散らばり方にかなり本音が出ています。';
      }
      if(info.focus === '集中'){
        return 'あなたは好みが狭いぶん、刺さった時の沈み方が深いです。雑な相手にはまったく反応しないのに、正しい角度で触れてくる相手には一気に弱くなるタイプです。';
      }
      if(info.boundary === '拒否ライン未提出'){
        return '青が少ないのは、心が広いというより、まだ自分の拒否ラインを他人に見せていない状態です。好きなものを語る前に、嫌なものを言える相手かどうかを見ています。';
      }
      return 'あなたの欲は単純ではありません。甘さと支配、羞恥と安心、妄想と現実が同時に走っています。だからこそ、強引なだけの相手では足りず、あなたの揺れを読める相手に一番弱いでしょう。';
    }

    function updateResult(){
      const result = resultMarkup();
      const red = result.picks.red.length;
      const blue = result.picks.blue.length;
      const done = red + result.picks.yellow.length + blue;

      document.getElementById('redCount').textContent = red;
      document.getElementById('blueCount').textContent = blue;
      document.getElementById('doneCount').textContent = '入力済み ' + done;
      document.getElementById('typeName').textContent = result.type;
      document.getElementById('typeHint').textContent = result.hint;
      document.getElementById('resultText').innerHTML = result.html;

      document.getElementById('categoryBars').innerHTML = result.bars.map(row => `
        <div>
          <div class="bar-head">
            <span>${escapeHtml(row.cat)} ${row.selected}/${row.total}件｜赤${row.red} 黄${row.yellow} 青${row.blue}</span>
            <span>${row.score}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${row.score}%"></div></div>
        </div>`).join('');
    }

    function shareText(){
      const result = resultMarkup();
      if(result.type === '未診断'){
        document.getElementById('shareText').value = 'まだ診断結果がありません。';
        return;
      }
      const topReds = result.picks.red.slice(0,6).map(x => x.item).join('、') || 'なし';
      const text = [
        '性癖の瓶メーカー診断結果',
        '',
        'タイプ：' + result.type,
        '中心：' + result.top.cat + ' / ' + result.second.cat,
        '赤い瓶：' + topReds,
        '相性の良いタイプ：' + partnerType(result.top, result.second, result.info),
        '',
        'ひとこと：' + makeSharpComment(result.top, result.second, result.info, result.picks),
        '',
        'あなたもやってみて',
        cleanAppUrl(),
        '',
        '※成人同士の同意・安全・合法が前提の娯楽用診断'
      ].join('\n');
      const area = document.getElementById('shareText');
      area.value = text;
      area.focus();
      area.select();
    }

    function cleanAppUrl(){
      const url = new URL(location.href);
      url.hash = '';
      url.searchParams.delete('v');
      return url.toString();
    }

    function resultMessageForLine(){
      const result = resultMarkup();
      const appUrl = cleanAppUrl();
      if(result.type === '未診断'){
        return ['これ試してみて','性癖の瓶メーカー',appUrl].join('\n');
      }
      const topReds = result.picks.red.slice(0,6).map(x => x.item).join('、') || 'なし';
      return [
        '性癖の瓶メーカー診断結果',
        '',
        'タイプ：' + result.type,
        '中心：' + result.top.cat + ' / ' + result.second.cat,
        '赤い瓶：' + topReds,
        '相性の良いタイプ：' + partnerType(result.top, result.second, result.info),
        '',
        'ひとこと：' + makeSharpComment(result.top, result.second, result.info, result.picks),
        '',
        'あなたもやってみて',
        appUrl,
        '',
        '※成人同士の同意・安全・合法が前提の娯楽用診断'
      ].join('\n');
    }

    async function copyTextForLine(text){
      const status = document.getElementById('copyStatus');
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(text);
        }else{
          const tmp = document.createElement('textarea');
          tmp.value = text;
          tmp.style.position = 'fixed';
          tmp.style.left = '-9999px';
          document.body.appendChild(tmp);
          tmp.focus();
          tmp.select();
          document.execCommand('copy');
          document.body.removeChild(tmp);
        }
        if(status) status.textContent = 'コピーしました。LINEに貼り付けてください。';
      }catch(e){
        const area = document.getElementById('shareText');
        if(area){
          area.value = text;
          area.focus();
          area.select();
        }
        if(status) status.textContent = '下の欄に表示しました。選択してコピーしてください。';
      }
    }


    function renderPoster(){
      const result = resultMarkup();
      const redCount = result.picks.red.length;
      const blueCount = result.picks.blue.length;
      const done = redCount + result.picks.yellow.length + blueCount;

      const colHtml = groups.map(group => `
        <div class="poster-col">
          <div class="poster-cat">${escapeHtml(group.cat)}</div>
          ${group.items.map(item => {
            const score = state[keyOf(group.cat,item)];
            const height = score === 0 ? 0 : (score >= 76 ? 92 : score >= 26 ? 65 : 38);
            const fill = score >= 76 ? '#ef4444' : score >= 26 ? '#facc15' : score > 0 ? '#3b82f6' : 'transparent';
            return `
              <div class="poster-bottle">
                <div class="cap"></div>
                <div class="neck"></div>
                <div class="body">
                  <div class="fill" style="height:${height}%;background:${fill}"></div>
                  <div class="glass"></div>
                </div>
                <div class="label">${formatBottleLabel(item)}</div>
              </div>`;
          }).join('')}
        </div>`).join('');

      document.getElementById('poster').innerHTML = `
        <div class="poster-head">
          <div>
            <div class="poster-title">性癖の瓶（オラクル鑑定版）</div>
            <div class="poster-sub">〜あなたの中の赤い瓶、青い瓶を分析します〜</div>
          </div>
          <div class="poster-legend">
            <span class="b">青：できない</span>
            <span class="y">黄：妄想ならあり</span>
            <span class="r">赤：興奮する</span>
          </div>
        </div>
        <div class="poster-summary">
          <span>診断タイプ：${escapeHtml(result.type)}</span>
          <span>${escapeHtml(result.hint)}</span>
          <span>赤 ${redCount}｜青 ${blueCount}｜入力 ${done}</span>
        </div>
        <div class="poster-grid">${colHtml}</div>
        <div class="poster-foot">
          <span>成人同士の同意・安全・合法が前提の娯楽用診断</span>
          <span>未入力は白、入力結果は青・黄・赤で表示</span>
        </div>`;
    }

    filterSelect.addEventListener('change', e => { filter = e.target.value; render(); });
    document.getElementById('resetBtn').addEventListener('click', () => {
      Object.keys(state).forEach(key => state[key] = 0);
      document.getElementById('shareText').value = '診断結果やLINEに貼り付ける文章がここに表示されます。';
      render();
    });
    document.getElementById('shareBtn').addEventListener('click', shareText);
    document.getElementById('lineAppBtn').addEventListener('click', () => {
      copyTextForLine(`これ試してみて\n性癖の瓶メーカー\n${cleanAppUrl()}`);
    });
    document.getElementById('lineResultBtn').addEventListener('click', () => {
      copyTextForLine(resultMessageForLine());
    });
    document.getElementById('posterBtn').addEventListener('click', () => {
      renderPoster();
      document.getElementById('screenPanel').classList.remove('hidden');
      document.getElementById('screenPanel').scrollIntoView({behavior:'smooth',block:'start'});
    });
    document.getElementById('backBtn').addEventListener('click', () => {
      document.body.classList.remove('poster-only');
      document.getElementById('screenPanel').classList.add('hidden');
      document.getElementById('posterOnlyBtn').textContent = 'スクショ専用表示';
      window.scrollTo({top:0,behavior:'smooth'});
    });
    document.getElementById('posterOnlyBtn').addEventListener('click', () => {
      document.body.classList.toggle('poster-only');
      document.getElementById('screenPanel').classList.remove('hidden');
      document.getElementById('posterOnlyBtn').textContent = document.body.classList.contains('poster-only') ? '通常スクショ表示' : 'スクショ専用表示';
      window.scrollTo({top:0,behavior:'smooth'});
    });
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    render();
  </script>
</body>
</html>
